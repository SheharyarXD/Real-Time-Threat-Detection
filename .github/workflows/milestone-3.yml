name: Milestone 3 agent verification
on:
  push:
    branches: [milestone-3-windows-agent]
  pull_request:
    paths: ['agent/**', 'backend/**', 'lib/backend-api.ts', 'components/soc/live-workspace.tsx', '.github/workflows/milestone-3.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sentinel_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: dotnet restore agent/Sentinel.Agent.Tests --locked-mode
      - run: dotnet run --project agent/Sentinel.Agent.Tests -c Release --no-restore
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest backend/tests -q
        env:
          SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/sentinel_ci
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r backend/requirements.lock
      - run: dotnet restore agent/Sentinel.Agent.Windows.Tests --locked-mode
      - run: dotnet run --project agent/Sentinel.Agent.Windows.Tests -c Release --no-restore
      - name: Publish controlled development package
        shell: powershell
        run: ./agent/scripts/Build-Agent.ps1
      - name: Native service and backend integration
        shell: powershell
        run: ./agent/ci/Windows-Smoke.ps1
